[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pibooth-media-templates"
dynamic = ["version"]
description = "pibooth plugin: photobooth-app style media templates (single, collage, animation, video, wigglegram) chosen from an icon bar, each with its own background"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "pibooth_media_templates/data/LICENSE-material-icons.txt"]
requires-python = ">=3.9"
keywords = ["pibooth", "photobooth", "raspberry pi", "templates", "collage", "wigglegram", "animation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Other Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "pibooth>=2.1.0",
    "Pillow",
    "PyYAML",
]

[project.optional-dependencies]
# Replace the camera background behind the guests (same engine as pibooth-modnet)
background = ["pibooth-modnet"]
# Wigglegram alignment. On Raspberry Pi OS prefer `sudo apt install python3-opencv`.
opencv = ["opencv-python-headless", "numpy"]
test = ["pytest", "numpy"]

[project.urls]
Homepage = "https://github.com/peteoheat/pibooth-media-templates"
Issues = "https://github.com/peteoheat/pibooth-media-templates/issues"

[project.scripts]
pibooth-media-templates = "pibooth_media_templates.cli:main"

# pibooth discovers plugins through this entry point group
[project.entry-points.pibooth]
pibooth_media_templates = "pibooth_media_templates"

[tool.setuptools]
packages = ["pibooth_media_templates", "pibooth_media_templates.data"]

[tool.setuptools.package-data]
"pibooth_media_templates.data" = ["*"]

[tool.setuptools.dynamic]
version = { attr = "pibooth_media_templates.__version__" }
